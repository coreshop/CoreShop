name: Behat [5.0]
on:
  push:
    branches: [ '5.0' ]
    paths:
      - 'composer.json'
      - 'features/**'
      - 'behat.yml.dist'
      - '*.php'
      - 'src/**'
      - '.github/workflows/behat-5.0.yml'
  pull_request_target:
    branches: [ '5.0' ]
  release:
    types: [ created ]
  schedule:
    - cron: "0 1 * * 1"

env:
  APP_ENV: "test"
  CORESHOP_SKIP_DB_SETUP: "1"
  PIMCORE_TEST_DB_DSN: "mysql://root:root@127.0.0.1:3306/coreshop_test"
  PIMCORE_INSTALL_ADMIN_USERNAME: "admin"
  PIMCORE_INSTALL_ADMIN_PASSWORD: "admin"
  PIMCORE_INSTALL_MYSQL_HOST_SOCKET: "127.0.0.1"
  PIMCORE_INSTALL_MYSQL_USERNAME: "root"
  PIMCORE_INSTALL_MYSQL_PASSWORD: "root"
  PIMCORE_INSTALL_MYSQL_DATABASE: "coreshop_test"
  PIMCORE_INSTALL_MYSQL_PORT: "3306"
  PIMCORE_KERNEL_CLASS: 'Kernel'
  PIMCORE_SECRET: "${{ secrets.PIMCORE_SECRET }}"
  PIMCORE_INSTALL_ENCRYPTION_SECRET: "${{ secrets.PIMCORE_SECRET }}"
  PIMCORE_INSTANCE_IDENTIFIER: "${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}"
  PIMCORE_INSTALL_INSTANCE_IDENTIFIER: "${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}"
  PIMCORE_INSTALL_PRODUCT_KEY: "${{ secrets.PIMCORE_PRODUCT_KEY }}"
  PIMCORE_PRODUCT_KEY: "${{ secrets.PIMCORE_PRODUCT_KEY }}"

permissions:
  contents: read

jobs:
  # The pull request trigger has no `paths:` filter on purpose: a workflow that does not start
  # reports no check at all, and a required check that never reports blocks the pull request
  # forever. The filter lives here instead — the tests are skipped when nothing relevant changed,
  # and the `Behat` gate at the end still reports a result.
  changes:
    name: "Detect relevant changes"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Match the changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          # Kept in sync with the `push` trigger's `paths:` above, as regular expressions.
          PATTERNS: |
            ^composer\.json$
            ^features/.*$
            ^behat\.yml\.dist$
            ^[^/]*\.php$
            ^src/.*$
            ^\.github/workflows/behat-5\.0\.yml$
        run: |
          # Anything but a pull request (push, release, schedule) is filtered by its trigger
          # already. The files endpoint lists at most 3000 files; a larger pull request just runs.
          if [ -z "$PR" ] || [ "$CHANGED_FILES" -gt 3000 ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"

          if grep -qE -f <(sed '/^[[:space:]]*$/d; s/^[[:space:]]*//' <<< "$PATTERNS") <<< "$files"; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No relevant files changed — the tests are skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

  behat:
    # `release` and `schedule` always run the workflow file from the default branch, so this job
    # also fires for releases of the other lines. Only tags of this line are checked here; the
    # other lines have their own copy of this workflow.
    if: ${{ needs.changes.outputs.relevant == 'true' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, '5.0.')) }}
    needs: changes
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.3
            pimcore: ^12.3
            dependencies: highest
            allow-failure: false
          - php: 8.4
            pimcore: ^12.3
            dependencies: highest
            allow-failure: true

    services:
      database:
        image: "mysql:8"
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    name: "${{ matrix.pimcore }}, PHP ${{ matrix.php }}, Deps ${{ matrix.dependencies }}"

    steps:
      - uses: actions/checkout@v7
        with:
          # On `schedule` the workflow runs from the default branch and `github.sha` is that
          # branch's head, not this line's — check the line's branch out explicitly. Releases
          # (the tag) and pushes keep `github.sha`, pull requests their head commit.
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'schedule' && '5.0') || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          allow-unsafe-pr-checkout: true

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: display_errors=On, display_startup_errors=On, error_reporting=32767
          extensions: intl, gd, simpleXML, dom, exif, fileinfo, iconv, mbstring, mysqli, pdo_mysql, zip, zlib

      - name: Check PHP Version
        run: php -v

      - name: Setup DB
        run: |
          mysql --host 127.0.0.1 --port ${{ job.services.database.ports['3306'] }} -uroot -proot -e "CREATE DATABASE coreshop_test CHARSET=utf8mb4;"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: pimcore/pimcore
        run: composer req pimcore/pimcore:${{ matrix.pimcore }} --no-interaction --no-scripts --no-update

      - if: matrix.dependencies == 'highest'
        name: Install dependencies highest
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - if: matrix.dependencies == 'lowest'
        name: Install dependencies lowest
        run: composer update --no-progress --prefer-dist --optimize-autoloader --prefer-lowest

      - name: Cache clear
        run: bin/console cache:clear

      - name: Assets Install
        run: bin/console assets:install --symlink

      - name: Install Pimcore
        run: PIMCORE_KERNEL_CLASS=Kernel vendor/bin/pimcore-install --env=test --skip-database-config

      - name: Install CoreShop
        run: |
          bin/console coreshop:install

      - name: Run Behat
        run: vendor/bin/behat --strict --no-interaction -vvv -f progress --config behat.yml.dist -p default

  # The one check to require in the branch ruleset. The matrix jobs above are named after their
  # matrix entries, which change with every PHP or Pimcore bump and are not unique across
  # workflows. `always()` is load-bearing: without it this job is skipped when a test fails, and
  # a skipped required check counts as passed.
  required:
    name: "Behat"
    needs: [ changes, behat ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *' failure '*|*' cancelled '*) exit 1 ;;
          esac
