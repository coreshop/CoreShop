name: Packages Components
on:
  push:
    branches: [ '5.0', 'next' ]
    paths:
      - 'src/CoreShop/Component/**'
      - '.github/workflows/packages_components.yml'
  pull_request:
    branches: [ '5.0', 'next' ]
  release:
    types: [ created ]
  schedule:
    - cron: "0 1 * * 1"
env:
  PIMCORE_SECRET: ${{ secrets.PIMCORE_SECRET }}
  PIMCORE_INSTALL_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_SECRET }}
  PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
  PIMCORE_INSTALL_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
  PIMCORE_INSTALL_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
  PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}

permissions:
  contents: read

jobs:
  # The pull request trigger has no `paths:` filter on purpose: a workflow that does not start
  # reports no check at all, and a required check that never reports blocks the pull request
  # forever. The filter lives here instead — the tests are skipped when nothing relevant changed,
  # and the `Packages Components` gate at the end still reports a result.
  changes:
    name: "Detect relevant changes"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Match the changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          # Kept in sync with the `push` trigger's `paths:` above, as regular expressions.
          PATTERNS: |
            ^src/CoreShop/Component/.*$
            ^\.github/workflows/packages_components\.yml$
        run: |
          # Anything but a pull request (push, release, schedule) is filtered by its trigger
          # already. The files endpoint lists at most 3000 files; a larger pull request just runs.
          if [ -z "$PR" ] || [ "$CHANGED_FILES" -gt 3000 ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"

          if grep -qE -f <(sed '/^[[:space:]]*$/d; s/^[[:space:]]*//' <<< "$PATTERNS") <<< "$files"; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No relevant files changed — the tests are skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

  list:
    if: ${{ needs.changes.outputs.relevant == 'true' && (github.repository == 'coreshop/CoreShop') }}
    needs: changes
    runs-on: ubuntu-latest
    name: "Create a list of packages"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: "List Packages"
        id: create-list
        run: echo "packages=$(find src/CoreShop/Component -mindepth 2 -maxdepth 2 -type f -name composer.json -exec dirname '{}' \; | sed -e 's/src\/CoreShop\///g' | sort | jq  --raw-input . | jq --slurp . | jq -c .)" >> $GITHUB_OUTPUT

    outputs:
      packages: "${{ steps.create-list.outputs.packages }}"

  test-packages:
    needs: list
    if: github.repository == 'coreshop/CoreShop'
    runs-on: ubuntu-latest
    name: "${{ matrix.package }}, PHP ${{ matrix.php }}, Pimcore ${{ matrix.pimcore }}"
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.3, 8.4 ]
        pimcore: [ ^12.3 ]
        dependencies: [ highest, lowest ]
        package: "${{ fromJson(needs.list.outputs.packages) }}"
        exclude:
          - php: 8.4
            dependencies: lowest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, gd, simpleXML, dom, exif, fileinfo, iconv, mbstring, mysqli, pdo_mysql, zip, zlib

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-pimcore-${{ matrix.pimcore }}-package-${{ matrix.package }}-composer-${{ hashFiles(format('src/CoreShop/{0}/composer.json', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.pimcore }}-package-${{ matrix.package }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.pimcore }}-package-

      - name: Validate composer.json
        run: composer validate --ansi --strict
        working-directory: "src/CoreShop/${{ matrix.package }}"

      - name: pimcore/pimcore
        run: composer req pimcore/pimcore:${{ matrix.pimcore }} --no-interaction --no-scripts --no-update
        env:
          COMPOSER_ROOT_VERSION: dev-master
        working-directory: "src/CoreShop/${{ matrix.package }}"

      - if: matrix.dependencies == 'highest'
        name: Install dependencies highest
        run: composer update --no-progress --prefer-dist --optimize-autoloader
        env:
          COMPOSER_ROOT_VERSION: dev-master
        working-directory: "src/CoreShop/${{ matrix.package }}"

      - if: matrix.dependencies == 'lowest'
        name: Install dependencies lowest
        run: composer update --no-progress --prefer-dist --optimize-autoloader --prefer-lowest
        env:
          COMPOSER_ROOT_VERSION: dev-master
        working-directory: "src/CoreShop/${{ matrix.package }}"

      - name: STAN
        run: |
          cp ../../../../phpstan-package.neon phpstan.neon
          vendor/bin/phpstan analyse -c phpstan.neon . -l 3
        working-directory: "src/CoreShop/${{ matrix.package }}"

  # The one check to require in the branch ruleset. The matrix jobs above are named after their
  # matrix entries, which change with every PHP or Pimcore bump and are not unique across
  # workflows. `always()` is load-bearing: without it this job is skipped when a test fails, and
  # a skipped required check counts as passed.
  required:
    name: "Packages Components"
    needs: [ changes, list, test-packages ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *' failure '*|*' cancelled '*) exit 1 ;;
          esac
