name: Static Tests (Lint, Stan)
on:
  push:
    branches: [ '2026.x' ]
    paths:
      - 'features/**'
      - 'behat.yml.dist'
      - 'src/**'
      - '*.php'
      - '*.neon'
      - '*.xml'
      - 'composer.json'
      - '.github/workflows/static.yml'
  pull_request_target:
    branches: [ '2026.x' ]
  release:
    types: [ created ]
  schedule:
    - cron: "0 1 * * 1"

# A newer push to the same pull request or branch supersedes the run that is still going: the
# older run would only report on a commit nobody looks at any more. The event name is part of the
# group so that a release or the weekly schedule is never cancelled by a push on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: "test"
  PIMCORE_TEST_DB_DSN: "mysql://root:root@127.0.0.1:3306/coreshop_test"
  PIMCORE_SECRET: "${{ secrets.PIMCORE_SECRET }}"
  PIMCORE_INSTALL_ENCRYPTION_SECRET: "${{ secrets.PIMCORE_SECRET }}"
  PIMCORE_INSTANCE_IDENTIFIER: "${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}"
  PIMCORE_INSTALL_INSTANCE_IDENTIFIER: "${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}"
  PIMCORE_INSTALL_PRODUCT_KEY: "${{ secrets.PIMCORE_PRODUCT_KEY }}"
  PIMCORE_PRODUCT_KEY: "${{ secrets.PIMCORE_PRODUCT_KEY }}"

jobs:
  # The pull request trigger has no `paths:` filter on purpose: a workflow that does not start
  # reports no check at all, and a required check that never reports blocks the pull request
  # forever. The filter lives here instead — the tests are skipped when nothing relevant changed,
  # and the `Static Tests` gate at the end still reports a result.
  changes:
    name: "Detect relevant changes"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Match the changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          # Kept in sync with the `push` trigger's `paths:` above, as regular expressions.
          PATTERNS: |
            ^features/.*$
            ^behat\.yml\.dist$
            ^src/.*$
            ^[^/]*\.php$
            ^[^/]*\.neon$
            ^[^/]*\.xml$
            ^composer\.json$
            ^\.github/workflows/static\.yml$
        run: |
          # Anything but a pull request (push, release, schedule) is filtered by its trigger
          # already. The files endpoint lists at most 3000 files; a larger pull request just runs.
          if [ -z "$PR" ] || [ "$CHANGED_FILES" -gt 3000 ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"

          if grep -qE -f <(sed '/^[[:space:]]*$/d; s/^[[:space:]]*//' <<< "$PATTERNS") <<< "$files"; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No relevant files changed — the tests are skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    # `release` and `schedule` always run the workflow file from the default branch, so this job
    # also fires for releases of the other lines. Only tags of this line are checked here; the
    # other lines have their own copy of this workflow.
    if: ${{ needs.changes.outputs.relevant == 'true' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, '2026.')) }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      # A failure in one matrix entry must not cancel the others: their results are part of the
      # same round of feedback.
      fail-fast: false
      matrix:
        php: [ 8.4, 8.5 ]
        pimcore: [ ^2026.2 ]
        dependencies: [ highest, lowest ]
        exclude:
          - php: 8.5
            dependencies: lowest
    services:
      database:
        image: "mysql:8"
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: coreshop_test
        ports:
          - 3306:3306
        # Installing the Pimcore class definitions issues hundreds of CREATE/ALTER TABLE
        # statements, and every one of them waits on an fsync. The test database lives and dies
        # with the job, so it has no business touching the disk at all — a RAM disk takes the
        # durability cost out of the DDL and out of the scenarios that write through it.
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=2g
    name: "${{ matrix.pimcore }}, PHP ${{ matrix.php }}, Deps ${{ matrix.dependencies }}"

    steps:
      - uses: actions/checkout@v7
        with:
          # On `schedule` the workflow runs from the default branch and `github.sha` is that
          # branch's head, not this line's — check the line's branch out explicitly. Releases
          # (the tag) and pushes keep `github.sha`, pull requests their head commit.
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'schedule' && '2026.x') || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          allow-unsafe-pr-checkout: true

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: display_errors=On, display_startup_errors=On, error_reporting=32767
          extensions: intl, gd, simpleXML, dom, exif, fileinfo, iconv, mbstring, mysqli, pdo_mysql, zip, zlib

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: pimcore/pimcore
        run: composer req pimcore/pimcore:${{ matrix.pimcore }} --no-interaction --no-scripts --no-update

      - name: Install dependencies ${{ matrix.dependencies }}
        id: install
        run: composer update --no-progress --prefer-dist --optimize-autoloader ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      # Every check below runs even when an earlier one failed, so one broken check does not hide
      # the result of the others behind another round trip. They only need the dependencies.
      - name: Validate YAML
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bin/console lint:yaml src

      - name: Validate TWIG
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bin/console lint:twig src

      - name: Validate Container
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bin/console lint:container

      - name: Validate Doctrine Settings
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bin/console doctrine:schema:validate --skip-sync

      - name: STAN
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cp -f config/packages/stan/config.yaml config/packages/dev/config.yaml
          bin/console cache:clear --env=dev
          vendor/bin/phpstan

      - name: PSALM
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          vendor/bin/psalm

  # The one check to require in the branch ruleset. The matrix jobs above are named after their
  # matrix entries, which change with every PHP or Pimcore bump and are not unique across
  # workflows. `always()` is load-bearing: without it this job is skipped when a test fails, and
  # a skipped required check counts as passed.
  required:
    name: "Static Tests"
    needs: [ changes, lint ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *' failure '*|*' cancelled '*) exit 1 ;;
          esac
