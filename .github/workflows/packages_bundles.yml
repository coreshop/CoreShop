name: Packages Bundles
on:
  push:
    branches: [ '2026.x' ]
    paths:
      - 'src/CoreShop/Bundle/**'
      - '.github/workflows/packages_bundles.yml'
  pull_request:
    branches: [ '2026.x' ]
  release:
    types: [ created ]
  schedule:
    - cron: "0 1 * * 1"

# A newer push to the same pull request or branch supersedes the run that is still going; the
# event name keeps a release or the weekly schedule from being cancelled by a push on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PIMCORE_SECRET: ${{ secrets.PIMCORE_SECRET }}
  PIMCORE_INSTALL_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_SECRET }}
  PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
  PIMCORE_INSTALL_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
  PIMCORE_INSTALL_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
  PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}

permissions:
  contents: read

jobs:
  # The pull request trigger has no `paths:` filter on purpose: a workflow that does not start
  # reports no check at all, and a required check that never reports blocks the pull request
  # forever. The filter lives here instead — the tests are skipped when nothing relevant changed,
  # and the `Packages Bundles` gate at the end still reports a result.
  changes:
    name: "Detect relevant changes"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Match the changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          # Kept in sync with the `push` trigger's `paths:` above, as regular expressions.
          PATTERNS: |
            ^src/CoreShop/Bundle/.*$
            ^\.github/workflows/packages_bundles\.yml$
        run: |
          # Anything but a pull request (push, release, schedule) is filtered by its trigger
          # already. The files endpoint lists at most 3000 files; a larger pull request just runs.
          if [ -z "$PR" ] || [ "$CHANGED_FILES" -gt 3000 ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"

          if grep -qE -f <(sed '/^[[:space:]]*$/d; s/^[[:space:]]*//' <<< "$PATTERNS") <<< "$files"; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No relevant files changed — the tests are skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

  list:
    # `release` and `schedule` always run the workflow file from the default branch, so this job
    # also fires for releases of the other lines. Only tags of this line are checked here; the
    # other lines have their own copy of this workflow.
    if: ${{ needs.changes.outputs.relevant == 'true' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, '2026.')) }}
    needs: changes
    runs-on: ubuntu-latest
    name: "Create a list of packages"

    steps:
      - uses: actions/checkout@v7
        with:
          # On `schedule` the workflow runs from the default branch and `github.sha` is that
          # branch's head, not this line's — check the line's branch out explicitly. Releases
          # (the tag) and pushes keep `github.sha`, pull requests their head commit.
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'schedule' && '2026.x') || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: "List Packages"
        id: create-list
        # A job per package spends more time checking out the repository and setting up PHP than
        # it spends on the package itself, and it puts one check per package on every pull
        # request. The packages are handed out in chunks instead: the same work, a fraction of
        # the setup, and a check list that can still be read.
        run: |
          chunks=$(find src/CoreShop/Bundle -mindepth 2 -maxdepth 2 -type f -name composer.json -exec dirname '{}' \; \
            | sed -e 's/src\/CoreShop\///g' \
            | sort \
            | jq --raw-input . \
            | jq --slurp --compact-output --argjson size "$CHUNK_SIZE" \
              '[range(0; length; $size) as $i | {index: ($i / $size + 1 | floor), packages: (.[$i:$i + $size] | join(" "))}]')

          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          echo "$chunks" | jq .
        env:
          # Chunks run in parallel, the packages within a chunk one after another. Larger chunks
          # save setup time and shorten the check list; smaller ones use more runners at once.
          CHUNK_SIZE: 8

    outputs:
      chunks: "${{ steps.create-list.outputs.chunks }}"

  test-packages:
    needs: list
    runs-on: ubuntu-latest
    name: "Chunk ${{ matrix.chunk.index }}, PHP ${{ matrix.php }}, Pimcore ${{ matrix.pimcore }}, Deps ${{ matrix.dependencies }}"
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.4, 8.5 ]
        pimcore: [ ^2026.2 ]
        dependencies: [ highest, lowest ]
        chunk: "${{ fromJson(needs.list.outputs.chunks) }}"
        exclude:
          - php: 8.5
            dependencies: lowest

    steps:
      - uses: actions/checkout@v7
        with:
          # On `schedule` the workflow runs from the default branch and `github.sha` is that
          # branch's head, not this line's — check the line's branch out explicitly. Releases
          # (the tag) and pushes keep `github.sha`, pull requests their head commit.
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'schedule' && '2026.x') || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, gd, simpleXML, dom, exif, fileinfo, iconv, mbstring, mysqli, pdo_mysql, zip, zlib

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependencies }}-packages-${{ hashFiles('src/CoreShop/Bundle/*/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependencies }}-packages-
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Validate, install and analyse
        # Every package of the chunk is checked even when an earlier one failed, so one broken
        # package does not hide the state of the rest behind another round trip.
        run: |
          status=0

          for package in ${{ matrix.chunk.packages }}; do
            echo "::group::$package"

            (
              set -e

              cd "src/CoreShop/$package"

              composer validate --ansi --strict
              composer req pimcore/pimcore:${{ matrix.pimcore }} --no-interaction --no-scripts --no-update

              if [ "${{ matrix.dependencies }}" = 'lowest' ]; then
                composer update --no-progress --prefer-dist --optimize-autoloader --prefer-lowest
              else
                composer update --no-progress --prefer-dist --optimize-autoloader
              fi

              cp ../../../../phpstan-package.neon phpstan.neon
              vendor/bin/phpstan analyse -c phpstan.neon . -l 3
            ) || status=1

            # Each package installs its own copy of Pimcore; a whole chunk of them at once does
            # not fit on the runner.
            rm -rf "src/CoreShop/$package/vendor"

            echo "::endgroup::"
          done

          exit $status
        env:
          COMPOSER_ROOT_VERSION: dev-main

  # The one check to require in the branch ruleset. The matrix jobs above are named after their
  # matrix entries, which change with every PHP or Pimcore bump and are not unique across
  # workflows. `always()` is load-bearing: without it this job is skipped when a test fails, and
  # a skipped required check counts as passed.
  required:
    name: "Packages Bundles"
    needs: [ changes, list, test-packages ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *' failure '*|*' cancelled '*) exit 1 ;;
          esac
