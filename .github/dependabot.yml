version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/src/CoreShop/Bundle/*/Resources/assets/pimcore-studio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      studio-npm:
        patterns:
          - "*"
