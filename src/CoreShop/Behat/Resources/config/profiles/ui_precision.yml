ui_precision:
    formatters:
        pretty:
            verbose: true
            paths: false
            snippets: false

    extensions:
        FriendsOfBehat\SymfonyExtension:
            bootstrap: behat-bootstrap.php
            kernel:
                path: src/BehatKernel.php
                class: BehatKernel
                environment: test_precision

        FriendsOfBehat\MinkDebugExtension:
            directory: etc/build
            clean_start: false
            screenshot: true

        Behat\MinkExtension:
            base_url: "http://localhost:9080/index_test_precision.php"
            sessions:
                default:
                    panther:
                        options:
                            browser: chrome
            show_auto: false

        Robertfausk\Behat\PantherExtension: ~

    calls:
        # Deprecations must never fail a scenario: Behat's runtime call handler turns every
        # reported error into a failing step, while Pimcore's own test setup (Codeception's
        # default error_level) reports deprecations without escalating them. 8191 is
        # E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED.
        error_reporting: 8191

    gherkin:
        filters:
            tags: '@ui_precision&&~@wip'
