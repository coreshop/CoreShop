        _controller: CoreShop\Bundle\CoreBundle\Controller\ProductValidationController::validateUnitDefinitionDeletionAction
    options:
        expose: true

coreshop_admin_purchsable_variant_unit_solidifier_check:
    path: /%coreshop.admin.route.base%/product-variant-solidifier/check/{objectId}
    requirements:
        backend: '%coreshop.admin.route.backend_requirement%'
    methods: [GET]
    defaults:
        backend: admin
        _controller: CoreShop\Bundle\CoreBundle\Controller\ProductVariantUnitSolidifierController::checkStatusAction
    options:
        expose: true

coreshop_admin_purchsable_variant_unit_solidifier_apply:
    path: /%coreshop.admin.route.base%/product-variant-solidifier/apply/{objectId}
    requirements:
        backend: '%coreshop.admin.route.backend_requirement%'
    methods: [PUT]
    defaults:
        backend: admin
        _controller: CoreShop\Bundle\CoreBundle\Controller\ProductVariantUnitSolidifierController::applyAction
    options:
        expose: true

coreshop_admin_product:
    type: coreshop.resources
    resource: |
      alias: coreshop.product
      no_default_routes: true
      additional_routes:
        config:
          path: remove-store-values
          action: removeStoreValues
          methods:
            - POST

