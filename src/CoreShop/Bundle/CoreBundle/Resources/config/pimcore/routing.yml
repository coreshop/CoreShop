payum_all:
    resource: "@PayumBundle/Resources/config/routing/all.xml"

coreshop_admin_payment_provider_config:
    path: /%coreshop.admin.route.base%/payment_providers/get-config
    requirements:
        backend: '%coreshop.admin.route.backend_requirement%'
    defaults:
        backend: admin
        _controller: 'coreshop.admin_controller.payment_provider::getConfigAction'
    options:
        expose: true

coreshop_admin_configuration_save_all:
    path: /%coreshop.admin.route.base%/configurations/save-all
    requirements:
        backend: '%coreshop.admin.route.backend_requirement%'
    defaults:
        backend: admin
        _controller: 'coreshop.admin_controller.configuration::saveAllAction'
    options:
        expose: true

coreshop_admin_configuration_get_all:
    path: /%coreshop.admin.route.base%/configurations/get-all
