services:
  CoreShop\Bundle\UserBundle\Studio\WebpackEntryPointProvider:
    tags:
      - { name: pimcore_studio_ui.webpack_entry_point_provider }
    # The extractor is injected through the trait's #[Required] setter; the services of this
    # file are not autowired, so the call is explicit.
    calls:
      - [setBuildArchiveExtractor, ['@Pimcore\Bundle\StudioUiBundle\Build\BuildArchiveExtractor']]
