services:
    # FormTypes für Rule Conditions/Actions in RuleBundle (EmptyConfigurationFormType etc.).
    # autoconfigure: true taggt sie automatisch mit `form.type`, sodass
    # RegisterStudioFormTypesPass sie in die BlockPrefixFormTypeRegistry übernimmt.
    CoreShop\Bundle\RuleBundle\Form\Type\Rule\:
        resource: '../../Form/Type/Rule/'
        public: true
        autoconfigure: true

    CoreShop\Bundle\RuleBundle\Form\Type\TimestampDateType:
        tags:
            - { name: form.type }
