parameters:
  coreshop.frontend_dir: '%kernel.project_dir%/public/bundles/coreshopfrontend/build'

twig:
    form_themes:
        - '@CoreShopFrontend/Form/fields.html.twig'

webpack_encore:
    output_path: '%kernel.project_dir%/public/build'
    builds:
        coreshop_frontend: '%coreshop.frontend_dir%'

framework:
    assets:
        packages:
            coreshop_frontend:
                json_manifest_path: '%coreshop.frontend_dir%/manifest.json'