services:
  _defaults:
    public: true
    autowire: true
    autoconfigure: true

  CoreShop\Bundle\OrderBundle\Studio\WebpackEntryPointProvider:
    tags:
      - { name: pimcore_studio_ui.webpack_entry_point_provider }

  # Studio v2 Grid: Order State custom columns.
  # Emits one column per workflow (Order/Payment/Shipping/Invoice) in the column picker.
  CoreShop\Bundle\OrderBundle\Grid\Column\Definition\OrderStateDefinition:
    tags:
      - { name: pimcore.studio_backend.grid_column_definition }

  CoreShop\Bundle\OrderBundle\Grid\Column\Resolver\OrderStateResolver:
    tags:
      - { name: pimcore.studio_backend.grid_column_resolver }

  CoreShop\Bundle\OrderBundle\Grid\Column\Collector\OrderStateCollector:
    tags:
      - { name: pimcore.studio_backend.grid_column_collector }

  # Studio v2 Grid Transformers (for Advanced Column power-user route)
  CoreShop\Bundle\OrderBundle\Grid\Column\Transformer\OrderState:
    tags:
      - { name: pimcore.studio_backend.grid_transformer }

  CoreShop\Bundle\OrderBundle\Grid\Column\Transformer\PriceFormatter:
    tags:
      - { name: pimcore.studio_backend.grid_transformer }
